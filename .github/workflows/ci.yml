name: ci

# Changes that only touch documentation or repository settings don't start a run. A tag always does:
# GitHub doesn't apply path filters to tags.
on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/dependabot.yml"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: abohatyrenko/postgresql-backup-restore
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  ORAS_IMAGE: ghcr.io/oras-project/oras:v1.3.6@sha256:9cfb578be975b762fd898b9d004243d8003aeb807a3e15b2ed212cdd1326c9eb
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

# Actions are pinned by commit, a tag can be moved to other code. Dependabot updates the pins.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck pg_backup_restore.sh test/e2e.sh scripts/check-version.sh scripts/release.sh

      # Chart and image share one version. A release tag that doesn't match fails here,
      # before anything is published.
      - name: Chart and image versions
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            scripts/check-version.sh "$GITHUB_REF_NAME"
          elif ! scripts/check-version.sh; then
            echo "::warning file=helm/Chart.yaml::Chart and image versions differ, the next release tag will fail until they match"
          fi

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: helm lint
        run: helm lint --strict ./helm

      - name: kubeconform
        run: |
          helm template ci ./helm \
            --set restore.enabled=true \
            --set deployNotification.enabled=true \
            --set secrets.SLACK_WEBHOOK_URL=https://example.com \
            --set secrets.BACKUP_PASSWORD=x \
            > rendered.yaml
          docker run --rm -v "$PWD:/w" "$KUBECONFORM_IMAGE" -strict -summary /w/rendered.yaml

      - name: values.schema.json rejects unknown values
        run: |
          if helm template ci ./helm --set backup.shedule=x >/dev/null 2>&1; then
            echo "::error file=helm/values.schema.json::a misspelled value was accepted"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Source -> target server versions. Up: from the oldest supported major to the newest.
      # Down: from the newest to the one before it, the usual way back after an upgrade.
      - name: Backup/restore against PostgreSQL 15 -> 18
        run: SOURCE_PG_VERSION=15 TARGET_PG_VERSION=18 test/e2e.sh

      - name: Backup/restore against PostgreSQL 18 -> 17
        run: SKIP_BUILD=1 SOURCE_PG_VERSION=18 TARGET_PG_VERSION=17 test/e2e.sh

  docker:
    needs: [lint, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No layer cache: a cached "apk add" layer is only invalidated by a Dockerfile or base image
      # change, so package security fixes would never get into the image
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: postgresql-backup-restore:scan
          pull: true

      # Before anything is published
      - name: Scan image for vulnerabilities
        uses: ./.github/actions/trivy-scan
        with:
          image: postgresql-backup-restore:scan

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true

  # After the image, so that a published chart never points to an image that doesn't exist yet
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Publish chart to oci://${{ env.CHART_REGISTRY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          helm package ./helm
          helm push "postgresql-backup-restore-${GITHUB_REF_NAME#v}.tgz" "oci://$CHART_REGISTRY"

      # Lets Artifact Hub verify who owns the chart repository:
      # https://artifacthub.io/docs/topics/repositories/helm-charts/#oci-support
      - name: Publish Artifact Hub repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -i -v "$PWD/helm:/workspace:ro" "$ORAS_IMAGE" push \
            --username "$GITHUB_ACTOR" --password-stdin \
            "$CHART_REGISTRY/postgresql-backup-restore:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml \
            <<<"$GITHUB_TOKEN"
