name: ci

on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: abohatyrenko/postgresql-backup-restore

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck pg_backup_restore.sh test/e2e.sh

      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint --strict ./helm

      - name: kubeconform
        run: |
          helm template ci ./helm \
            --set restore.enabled=true \
            --set deployNotification.enabled=true \
            --set secrets.slack_webhook_url=https://example.com \
            --set secrets.postgresql_backup=x \
            > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:latest -strict -summary /w/rendered.yaml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Backup/restore against PostgreSQL 13 -> 17
        run: SOURCE_PG_VERSION=13 TARGET_PG_VERSION=17 test/e2e.sh

      - name: Backup/restore against PostgreSQL 17 -> 16
        run: SKIP_BUILD=1 SOURCE_PG_VERSION=17 TARGET_PG_VERSION=16 test/e2e.sh

  docker:
    needs: [lint, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
