name: security-scan

# New vulnerabilities are found in already published images all the time.
# A failed run means the image should be rebuilt and released as a new patch version.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned by digest: trivy-action and Trivy image tags were hijacked in a 2026 supply chain attack
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  scan-published-image:
    runs-on: ubuntu-latest
    steps:
      - name: Scan abohatyrenko/postgresql-backup-restore:latest
        run: |
          docker run --rm "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            abohatyrenko/postgresql-backup-restore:latest
