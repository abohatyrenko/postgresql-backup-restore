name: security-scan

# New vulnerabilities are found in already published images all the time.
# A failed run means the image should be rebuilt and released as a new patch version.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-published-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan abohatyrenko/postgresql-backup-restore:latest
        uses: ./.github/actions/trivy-scan
        with:
          image: abohatyrenko/postgresql-backup-restore:latest
