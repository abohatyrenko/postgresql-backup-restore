# Default values for postgresql-backup-restore.
# All script settings are environment variables, see the project README for the full list.

image:
  repository: abohatyrenko/postgresql-backup-restore
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account, e.g. for IRSA / workload identity:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/pg-backup
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  automountServiceAccountToken: false

# Scheduled backup
backup:
  enabled: true
  schedule: "0 11 * * *" # every day at 11:00
  # IANA time zone for the schedule, e.g. "Europe/Kyiv" (Kubernetes >= 1.27). Empty = controller time zone (usually UTC)
  timeZone: ""
  suspend: false
  concurrencyPolicy: Forbid
  # Skip the run if it could not be started within this many seconds of the schedule
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  activeDeadlineSeconds: 21600 # 6 hours
  ttlSecondsAfterFinished: 86400
  args: ["backup"]
  # Read BACKUP_PASSWORD from a separate Secret instead of existingSecret / secrets
  passwordSecret:
    name: ""
    key: BACKUP_PASSWORD
  # Environment variables only for backup jobs
  env: {}
    # BACKUP_KEEP_DAYS: "30"
    # AGE_RECIPIENTS: "age1..."
    # HEARTBEAT_URL: "https://hc-ping.com/<uuid>"

# On-demand restore. Rendered as a suspended CronJob that is never scheduled;
# start a restore with:
#   kubectl create job --from=cronjob/<release>-restore restore-$(date +%s)
restore:
  enabled: false
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  # Add a backup file name to restore a specific backup instead of the latest one
  args: ["restore"]
  # Read RESTORE_PASSWORD from a separate Secret instead of existingSecret / secrets.
  # Useful to make sure a restore can never run with production credentials.
  passwordSecret:
    name: ""
    key: RESTORE_PASSWORD
  # Environment variables only for restore jobs
  env: {}
    # RESTORE_CONFIRM must equal RESTORE_DATABASE, otherwise the restore is refused
    # RESTORE_CONFIRM: ""
    # RESTORE_SOURCE_DATABASE: ""

# Plain environment variables for all jobs
env: {}
  # S3_BUCKET_PATH: "s3://my-bucket/postgresql"
  # S3_ENDPOINT: "https://fra1.digitaloceanspaces.com" # leave empty for AWS S3
  # AWS_REGION: "eu-central-1" # region of the bucket

  # BACKUP_DATABASE: ""
  # BACKUP_HOST: ""
  # BACKUP_USER: ""
  # BACKUP_PORT: "5432"

  # RESTORE_DATABASE: ""
  # RESTORE_HOST: ""
  # RESTORE_USER: ""
  # RESTORE_PORT: "5432"

  # PGSSLMODE: "verify-full"
  # PGSSLROOTCERT: "/etc/pg-ca/ca-certificate.crt"

# Additional environment variables in Kubernetes EnvVar format (e.g. valueFrom)
extraEnv: []
envFrom: []

# Secret variables. Keys are named after the environment variables they set.
# Use an existing Secret instead of creating one; it may contain any of the keys below.
existingSecret: ""

# Values for the Secret created by the chart (ignored when existingSecret is set).
# Empty values are not rendered.
secrets:
  # Leave AWS keys empty to use IRSA / instance profile / workload identity
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  BACKUP_PASSWORD: ""
  RESTORE_PASSWORD: ""
  # age secret key (AGE-SECRET-KEY-1...), needed to restore encrypted backups.
  # Better keep it out of the backup cluster and only provide it when restoring.
  AGE_IDENTITY: ""
  SLACK_WEBHOOK_URL: ""

# Scratch space for dump files. The whole dump is written here before upload,
# so sizeLimit must be larger than the (compressed) dump.
workDir:
  sizeLimit: 10Gi
  # Replace the default emptyDir, e.g. with an ephemeral or persistent volume
  volume: {}
    # ephemeral:
    #   volumeClaimTemplate:
    #     spec:
    #       accessModes: ["ReadWriteOnce"]
    #       resources:
    #         requests:
    #           storage: 100Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# e.g. mount the DigitalOcean CA certificate for PGSSLMODE=verify-full
extraVolumes: []
  # - name: pg-ca
  #   secret:
  #     secretName: pg-ca
extraVolumeMounts: []
  # - name: pg-ca
  #   mountPath: /etc/pg-ca
  #   readOnly: true

# Slack message on helm install/upgrade/rollback (uses secrets.SLACK_WEBHOOK_URL).
# Backup/restore failures are reported by the jobs themselves when the webhook is set.
deployNotification:
  enabled: false
