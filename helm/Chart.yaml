apiVersion: v2
name: postgresql-backup-restore
description: Scheduled PostgreSQL backups (pg_dump) to S3-compatible storage with encryption, retention and restore
type: application

# The chart and the image share one version: version, appVersion and the image in
# artifacthub.io/images below must be equal (checked by scripts/check-version.sh).
version: 2.1.0
appVersion: "2.1.0"

kubeVersion: ">=1.21.0-0"
home: https://github.com/abohatyrenko/postgresql-backup-restore
sources:
  - https://github.com/abohatyrenko/postgresql-backup-restore
icon: https://www.postgresql.org/media/img/about/press/elephant.png
keywords:
  - postgresql
  - postgres
  - backup
  - restore
  - pg_dump
  - s3
  - cronjob
maintainers:
  - name: Anatolii Bohatyrenko
    url: https://github.com/abohatyrenko

annotations:
  artifacthub.io/displayName: PostgreSQL Backup & Restore
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/abohatyrenko/postgresql-backup-restore
    - name: Documentation
      url: https://github.com/abohatyrenko/postgresql-backup-restore#readme
    - name: Docker image
      url: https://hub.docker.com/r/abohatyrenko/postgresql-backup-restore
  artifacthub.io/images: |
    - name: postgresql-backup-restore
      image: abohatyrenko/postgresql-backup-restore:2.1.0
  artifacthub.io/changes: |
    - kind: changed
      description: PostgreSQL 18 client tools, so servers up to version 18 can be backed up
    - kind: fixed
      description: A backup or restore killed by SIGTERM (job deadline, pod eviction) is reported as failed to Slack and the heartbeat, not as a success
    - kind: fixed
      description: BACKUP_KEEP_DAYS with a leading zero (e.g. 08) no longer skips the cleanup silently
    - kind: changed
      description: A failed cleanup of expired backups is reported (log, Slack) without failing the backup, which is already uploaded
    - kind: fixed
      description: deployNotification no longer fails the release when the Secret has no slack_webhook_url key; its pod follows nodeSelector and tolerations
    - kind: removed
      description: Checks for values of chart versions older than 1.0.0
