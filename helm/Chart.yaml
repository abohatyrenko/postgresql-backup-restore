apiVersion: v2
name: postgresql-backup-restore
description: Scheduled PostgreSQL backups (pg_dump) to S3-compatible storage with encryption, retention and restore
type: application

# The chart and the image share one version: version, appVersion and the image in
# artifacthub.io/images below must be equal (checked by scripts/check-version.sh).
version: 2.0.0
appVersion: "2.0.0"

kubeVersion: ">=1.21.0-0"
home: https://github.com/abohatyrenko/postgresql-backup-restore
sources:
  - https://github.com/abohatyrenko/postgresql-backup-restore
icon: https://www.postgresql.org/media/img/about/press/elephant.png
keywords:
  - postgresql
  - postgres
  - backup
  - restore
  - pg_dump
  - s3
  - cronjob
maintainers:
  - name: Anatolii Bohatyrenko
    url: https://github.com/abohatyrenko

annotations:
  artifacthub.io/displayName: PostgreSQL Backup & Restore
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/abohatyrenko/postgresql-backup-restore
    - name: Documentation
      url: https://github.com/abohatyrenko/postgresql-backup-restore#readme
    - name: Docker image
      url: https://hub.docker.com/r/abohatyrenko/postgresql-backup-restore
  artifacthub.io/images: |
    - name: postgresql-backup-restore
      image: abohatyrenko/postgresql-backup-restore:2.0.0
  artifacthub.io/changes: |
    - kind: changed
      description: Image is 158 MB instead of 514 MB; built on alpine with only the PostgreSQL client tools, S3 is accessed with rclone instead of the AWS CLI
    - kind: changed
      description: "Breaking: S3_UPLOAD_EXTRA_OPTS takes rclone flags instead of aws s3 cp options; see Upgrading to 2.0.0 in the README"
    - kind: added
      description: S3_PROVIDER for the rclone S3 provider of S3-compatible storage
    - kind: fixed
      description: restore and list fail when the bucket can't be listed instead of reporting no backups
    - kind: removed
      description: Script path /opt/pg_backup_restore.sh of image 0.x
